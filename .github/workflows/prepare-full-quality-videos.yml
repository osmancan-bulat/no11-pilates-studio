name: Prepare full-quality local videos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-full-quality-videos.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download mobile Safari-safe hero video
        run: |
          curl -L --fail --retry 3 -o public/no11-mobile-full-quality.mp4 "https://github.com/osmancan-bulat/no11-pilates-studio/releases/download/v1.0.1/no11-mobile-web-hq.2.mp4"
          echo "f84a795f44843f6dba06c5b567bbccc87a9567ae9ee28f76780d150f7209494b  public/no11-mobile-full-quality.mp4" | sha256sum -c -

      - name: Use same-origin mobile video path only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/[[...path]]/route.js")
          text = path.read_text()
          text = text.replace(
              "https://github.com/osmancan-bulat/no11-pilates-studio/releases/download/v1.0.1/no11-mobile-web-hq.2.mp4",
              "/no11-mobile-full-quality.mp4",
          )
          path.write_text(text)
          PY

      - name: Commit mobile video fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/[[...path]]/route.js public/no11-mobile-full-quality.mp4
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Serve Safari-safe mobile hero video locally"
          git push origin HEAD:main
