name: Restore premium origin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-premium-origin.yml'

permissions:
  contents: write

jobs:
  restore-premium-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update only origin constants
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/[[...path]]/route.js')
          text = path.read_text(encoding='utf-8')

          old_origin = 'const ORIGIN = "https://no11-pilates-studio-aihbdj6zg-osmancanbulat197-7442s-projects.vercel.app";'
          old_style = 'const STYLE_ORIGIN = "https://no11-pilates-studio-rfj4dz9b5-osmancanbulat197-7442s-projects.vercel.app";'
          new_origin = 'const ORIGIN = "https://no11-pilates-studio-ro9kcm7fd-osmancanbulat197-7442s-projects.vercel.app";'
          new_style = 'const STYLE_ORIGIN = "https://no11-pilates-studio-ro9kcm7fd-osmancanbulat197-7442s-projects.vercel.app";'

          if old_origin not in text:
              raise SystemExit('Expected ORIGIN was not found; refusing to modify the file.')
          if old_style not in text:
              raise SystemExit('Expected STYLE_ORIGIN was not found; refusing to modify the file.')

          text = text.replace(old_origin, new_origin, 1).replace(old_style, new_style, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit exact change
        run: |
          git config user.name "no11-safe-update"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/[[...path]]/route.js'
          git diff --cached --check
          git commit -m "Restore premium site origin without touching Firebase"
          git push origin HEAD:main
